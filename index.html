<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="version" content="1.2">
<meta name="description" content="말굽자석 사이 전기 그네, 막대자석 앞 코일, 정류자가 달린 전동기로 자기장 속에서 전류가 흐르는 코일이 받는 힘의 방향과 크기를 탐구하고 플레밍 왼손 법칙으로 힘의 방향을 맞혀 보는 중학교 과학 가상실험실">
<meta property="og:title" content="송쌤과학 가상실험실 | 전류가 흐르는 코일이 받는 힘">
<meta property="og:description" content="전류 방향·자석의 극·전류 세기를 바꾸며 코일이 움직이는 방향을 관찰하고, 전동기가 계속 도는 까닭을 정류자로 확인해요">
<meta name="theme-color" id="metaTheme" content="#101b28">
<title>송쌤과학 가상실험실 | 전류가 흐르는 코일이 받는 힘</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>(function(){try{var t=localStorage.getItem('ssv-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}})();</script>
<style>
/* ① 테마와 무관한 토큰 */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --r-1:6px;--r-2:10px;--r-3:16px;--r-full:999px;
  --control-h:34px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:56px;--rail-w:84px;--panel-w:clamp(360px,33vw,480px);
  --light-angle:315deg;
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
}
/* ② 테마 토큰 — 두 블록은 같은 목록을 갖는다 */
/* 장면·실물 색 — 테마와 무관(전원 장치 표시창·자석 도색은 실물 색) */
:root{
  --lcd:#0c1512;--lcd-on:#ffb547;--led-on:#6ee7a0;--led-off:#3b4b45;
  --supply:#2c343c;--supply-edge:#11171c;--supply-hi:#ffffff;--supply-ink:#d7dee4;--supply-btn:#3a444e;--knob:#1c2227;
  --lead-pos:#e04848;--lead-neg:#2b2f34;
}
/* ② 테마 토큰 — 두 블록은 같은 목록을 갖는다 */
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0b131d;--surface-1:#101b28;--surface-2:#182636;
  --stage:#0e1a27;--stage-2:#132233;
  --text-1:#e8eff5;--text-2:#b0c0cf;--text-3:#8ea2b4;
  --line-1:#223445;--line-2:#34495d;
  --accent:#e8eff5;--accent-strong:#ffffff;--accent-soft:#223445;--on-accent:#0b131d;
  --focus:#e8eff5;--scrim:#02070dcc;
  --ok:#6fdcae;--ok-soft:#1d3b32;--warn:#ffcf5c;--warn-soft:#3f3822;--danger:#ff9d8a;--danger-soft:#3d2320;--rev-soft:#16304a;
  --track:#1b2a3b;
  --field:#5cc8f0;--field-soft:#5cc8f024;--cur:#c3e84f;--cur-soft:#c3e84f22;--force:#ff8a3d;--force-soft:#ff8a3d26;
  --pole-n:#d9483f;--pole-s:#3b78d0;--pole-n-ink:#ff8f86;--pole-s-ink:#8fb8ff;--on-pole:#ffffff;
  --wire:#c9803f;--enamel:#8f4f22;--brass:#c9a24a;--carbon:#3a3d42;--metal-mid:#9aa5b1;--acrylic:#9fc3d6;--glass:#9fc3d6;--foil:#c9d1d8;--clip:#34383d;--wood:#7f6047;
  --skin:#f0c09c;--skin-hi:#ffe1c8;--skin-lo:#c98c66;--skin-line:#7a4a33;--nail:#f8d6cf;--nail-hi:#ffffff;--nail-line:#c98f84;
  --sleeve:#e9eef2;--sleeve-hi:#ffffff;--sleeve-lo:#aab6c0;
  --shadow-ink:#000000;
  --shadow-color:215 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf1f4;--surface-1:#fbfcfd;--surface-2:#e3eaf0;
  --stage:#f5f8fa;--stage-2:#e9eff4;
  --text-1:#132a3b;--text-2:#44596b;--text-3:#566b7e;
  --line-1:#d3dde5;--line-2:#b2c3d0;
  --accent:#17293a;--accent-strong:#0b1824;--accent-soft:#e3eaf0;--on-accent:#ffffff;
  --focus:#17293a;--scrim:#0b1a2680;
  --ok:#11775a;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;--danger:#b3261e;--danger-soft:#fde4e1;--rev-soft:#dcecf6;
  --track:#e3eaf0;
  --field:#0a86c2;--field-soft:#0a86c21f;--cur:#5f8f00;--cur-soft:#5f8f001f;--force:#dd5a0b;--force-soft:#dd5a0b1f;
  --pole-n:#d63c33;--pole-s:#2f6cc4;--pole-n-ink:#b3261e;--pole-s-ink:#1f58a8;--on-pole:#ffffff;
  --wire:#c47a37;--enamel:#8f4f22;--brass:#c9a24a;--carbon:#44474c;--metal-mid:#a3aeb9;--acrylic:#a8cfe0;--glass:#6f9ab3;--foil:#b9c2ca;--clip:#3d4247;--wood:#b08760;
  --skin:#f0c09c;--skin-hi:#ffe1c8;--skin-lo:#c98c66;--skin-line:#8a5638;--nail:#f8d6cf;--nail-hi:#ffffff;--nail-line:#c98f84;
  --sleeve:#ffffff;--sleeve-hi:#ffffff;--sleeve-lo:#9fb0bd;
  --shadow-ink:#3d4f60;
  --shadow-color:210 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .3);
  --edge-hi:0 0 #0000;
}
/* ③ 마감 기본층 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--field) 32%,transparent)}
input,textarea{caret-color:var(--text-1)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic .fill{fill:currentColor;stroke:none}

/* 상단 바 */
.topbar{position:relative;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1);letter-spacing:0}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:center;gap:8px;min-width:0;font:700 15px/1.2 var(--font-ui);color:var(--text-1)}
.top-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver{font:600 12px/1 var(--font-ui);color:var(--text-2);border:1px solid var(--line-2);border-radius:var(--r-1);padding:3px 6px;font-variant-numeric:tabular-nums}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}

/* 앱 골격 */
.appbody{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:calc(100dvh - var(--top-h))}
.rail{display:flex;flex-direction:column;gap:4px;padding:12px 8px;background:var(--surface-1);border-right:1px solid var(--line-1);overflow-y:auto}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;padding:8px 2px;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);font:600 12px/1.25 var(--font-ui);text-align:center;cursor:pointer}
.rail button svg.ic{width:23px;height:23px;stroke-width:1.7}
.rail button .s{display:none}
.rail button[aria-current="page"]{background:var(--surface-2);color:var(--text-1);font-weight:800}
.rail button[aria-current="page"]::after{content:'';position:absolute;left:-8px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--text-1)}
@media (hover:hover) and (pointer:fine){.rail button:hover{color:var(--text-1)}}
main{position:relative;overflow:auto;padding:12px 16px 14px;min-width:0;outline:none}
.lab{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;height:100%;min-height:0}
.lab-head{display:flex;align-items:center;gap:6px 14px;min-height:34px;flex-wrap:wrap}
.lab-head h1{font:800 18px/1.3 var(--font-title);letter-spacing:-.02em}
.goal{margin:0;font-size:13px;line-height:1.45;color:var(--text-2);font-weight:500}
.goal b{color:var(--text-1)}
.head-seg{margin-left:auto}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:14px;min-height:0}
.bench{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--stage);overflow:hidden}
.bench-head{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-bottom:1px solid var(--line-1);background:var(--surface-1)}
.bh-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;flex:1}
.bh-note{font-size:13px;color:var(--text-2);font-weight:500}
.stage{position:relative;flex:1;min-height:0}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.status .ex{color:var(--text-2)}
.status b{font-weight:700}
.status{margin:0;padding:10px 14px;min-height:64px;border-top:1px solid var(--line-1);background:var(--surface-1);font-size:15px;line-height:1.55;color:var(--text-1)}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1);overflow:hidden}
.panel-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 14px 14px;scrollbar-gutter:stable}
.panel-foot{border-top:1px solid var(--line-1);padding:10px 14px 12px;background:var(--surface-1);display:grid;gap:8px}
.pg+.pg{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-1)}
.pg-title{font:700 13px/1.3 var(--font-ui);color:var(--text-2);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pg-row .pg-title{margin:0}
.count{font:700 12px/1 var(--font-ui);color:var(--text-2);padding:3px 7px;border:1px solid var(--line-2);border-radius:var(--r-full)}
.help{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--text-2)}
.help b{color:var(--text-1)}
.empty{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--text-2)}
.linkbtn{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 6px;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);font:600 12px/1 var(--font-ui);cursor:pointer;position:relative}
.linkbtn::before{content:'';position:absolute;inset:-7px -2px}
.linkbtn svg.ic{width:15px;height:15px}
@media (hover:hover) and (pointer:fine){.linkbtn:hover{color:var(--text-1);background:var(--surface-2)}}

/* 컨트롤 */
.tool{position:relative;display:inline-flex;align-items:center;gap:6px;height:var(--control-h);padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-1);color:var(--text-1);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.tool::before{content:'';position:absolute;inset:-5px -2px}
.tool svg.ic{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-2);font-weight:800}
.tool.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.tool.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.tool.save{margin-left:auto;border-color:transparent;background:transparent;color:var(--text-2)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool[aria-busy="true"]{opacity:.55;cursor:progress}
.tool:active:not(:disabled){transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.tool:hover:not(:disabled):not(.primary){background:var(--surface-2)}}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
.seg button{position:relative;min-height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--shadow-1),inset 0 -2px 0 var(--text-1)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-3px 0}
.btn svg.ic{width:17px;height:17px}
.btn.primary{min-height:42px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.small{min-height:34px;padding:0 10px}
.btn.small::before{inset:-5px 0}
.btn.wide{width:100%}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--text-2);font-weight:800}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled):not(.primary){background:var(--surface-2)}}
.rng{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--font-ui);color:var(--text-2)}
.rng input{width:160px;min-height:32px}
.rng.wide input{width:220px}
.rng output{min-width:52px;font:800 14px/1 var(--font-ui);color:var(--text-1)}
input[type=range]{cursor:pointer}
.check{display:flex;gap:9px;align-items:center;min-height:40px;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px}
.shutter{position:absolute;inset:0;background:var(--surface-1);opacity:0;pointer-events:none;animation:shutter .32s ease-out;z-index:8}
@keyframes shutter{25%{opacity:.6}100%{opacity:0}}

/* 실험 조작판 */
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.vrow input{width:100%;min-height:32px}
.vrow output{min-width:58px;text-align:right;font:800 15px/1 var(--font-ui);color:var(--text-1)}
.vrow label{font:700 13px/1 var(--font-ui);color:var(--text-2)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.meter{padding:7px 9px;border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--surface-0)}
.meter span{display:block;font:600 12px/1.2 var(--font-ui);color:var(--text-2)}
.meter b{font:800 18px/1.3 var(--font-ui);color:var(--text-1)}
.meter small{font:700 12px/1 var(--font-ui);color:var(--text-2);margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.check.tight{min-height:32px}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--c);margin-right:2px;vertical-align:3px}
.rec{width:100%;border-collapse:collapse;font-size:13px}
.rec th{font:600 12px/1.3 var(--font-ui);color:var(--text-2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line-2);vertical-align:bottom}
.rec td{padding:7px 4px;border-bottom:1px solid var(--line-1);vertical-align:middle;line-height:1.4}
.rec td.num{text-align:right;white-space:nowrap}
.rec .c-step{font-weight:700;white-space:nowrap}
.rec .c-cond{color:var(--text-2);font-size:12px}
.rec .pending{color:var(--text-3)}
.rec tr.fresh td{background:color-mix(in oklab,var(--ok) 12%,transparent)}
.rec tr.now td:first-child{box-shadow:inset 3px 0 0 var(--text-1)}
.dirtag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-full);background:var(--force-soft);color:var(--text-1);font:800 12px/1.35 var(--font-ui);border:1px solid color-mix(in oklab,var(--force) 55%,transparent);white-space:nowrap}
.dirtag.pull{background:var(--field-soft);border-color:color-mix(in oklab,var(--field) 55%,transparent)}
.bar{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:3px;min-width:60px}
.bar i{display:block;height:100%;background:var(--force);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);margin:0 0 6px}
/* 왼손 법칙 */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{padding:9px 10px 10px;border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--surface-0)}
.step[data-state="ok"]{border-color:color-mix(in oklab,var(--ok) 55%,var(--line-1))}
.step h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 13px/1.35 var(--font-ui)}
.step h3 .cn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:800 12px/1 var(--font-ui)}
.step[data-state="ok"] h3 .cn{background:var(--ok);color:var(--surface-1)}
.dirs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.dirbtn{position:relative;display:grid;justify-items:center;gap:2px;min-height:44px;padding:5px 0;border:1.5px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-1);color:var(--text-1);font:700 12px/1.1 var(--font-ui);cursor:pointer}
.dirbtn svg{width:18px;height:18px}
.dirbtn[aria-pressed="true"]{border-color:var(--dc,var(--text-1));background:color-mix(in oklab,var(--dc,var(--text-1)) 16%,var(--surface-1));font-weight:800;box-shadow:inset 0 0 0 1px var(--dc,var(--text-1))}
.dirbtn:disabled{opacity:.35;cursor:not-allowed}
.dirbtn.right-ans{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.fb{margin:0;min-height:20px;font-size:13px;line-height:1.5;font-weight:600;color:var(--text-2)}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--warn)}
.score{font:800 13px/1 var(--font-ui);color:var(--text-1)}
/* ⑤ 탐구 질문 */
.lab-quiz{grid-template-rows:auto minmax(0,1fr)}
.quiz-list{overflow:auto;min-height:0;display:grid;gap:10px;align-content:start;padding:0 2px 8px;overscroll-behavior:contain;scrollbar-gutter:stable}
.policy{padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-1);font-size:13px;line-height:1.6}
.policy p{margin:0}
.policy .save-note{color:var(--text-2);margin-top:2px}
.qcard{border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1)}
.qcard summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;min-height:52px}
.qcard summary::-webkit-details-marker{display:none}
.qn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:800 13px/1 var(--font-ui)}
.qt{font:800 15px/1.35 var(--font-ui)}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.badge{padding:3px 8px;border-radius:var(--r-full);font:700 12px/1.2 var(--font-ui);border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.lock{background:var(--ok-soft);color:var(--text-1);border-color:transparent}
.badge.rev{background:var(--rev-soft);color:var(--text-1);border-color:transparent}
.badge.hint{background:var(--warn-soft);color:var(--text-1);border-color:transparent}
.chev{color:var(--text-2);transition:transform var(--dur-fast) var(--ease-out)}
.qcard[open] .chev{transform:rotate(90deg)}
.qbody{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px;padding:2px 14px 16px;align-items:start}
figure.mini{margin:0;position:sticky;top:0;border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--stage);overflow:hidden}
.mini figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;padding:8px 10px;border-bottom:1px solid var(--line-1);background:var(--surface-1);font-size:13px}
.mini figcaption b{font-weight:800}
.tag{padding:2px 8px;border-radius:var(--r-full);background:var(--field-soft);color:var(--text-1);font:800 12px/1.3 var(--font-ui)}
.how{flex-basis:100%;color:var(--text-2);font-size:12px;line-height:1.45}
.mini-stage{position:relative;aspect-ratio:16/10;max-height:300px}
.mini-stage>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.mini-result{margin:0;padding:8px 10px;min-height:46px;font-size:13px;line-height:1.5;border-top:1px solid var(--line-1);background:var(--surface-1);font-variant-numeric:tabular-nums}
.mini-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line-1);background:var(--surface-1)}
.mc-range{display:flex;align-items:center;gap:6px;flex:1;min-width:190px;font:600 12px/1 var(--font-ui);color:var(--text-2)}
.mc-range input{flex:1;min-width:0;min-height:32px}
.mc-range output{min-width:48px;text-align:right;font:800 13px/1 var(--font-ui);color:var(--text-1)}
.mc-sel{display:flex;align-items:center;gap:4px;font:800 13px/1 var(--font-ui)}
.mc-sel select{height:34px;max-width:150px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-0);padding:0 6px;font-size:16px}
.qq{margin:0 0 4px;font:600 15px/1.65 var(--font-ui)}
.qsrc{margin:0 0 10px;font-size:12px;color:var(--text-2)}
.alabel{display:block;font:800 13px/1.3 var(--font-ui);margin-bottom:5px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0);color:var(--text-1);font-size:16px;line-height:1.6;resize:vertical}
textarea.locked{background:var(--surface-2);color:var(--text-2)}
.arow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px;font-size:12px;color:var(--text-2)}
.lockline{color:var(--text-1);font-weight:600}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.hintp,.modelp,.revp{margin-top:8px;padding:10px 12px;border-radius:var(--r-2);font-size:13px;line-height:1.65}
.hintp{background:var(--warn-soft)}
.hintp p,.modelp p{margin:0}
.hintp small{display:block;margin-top:4px;color:var(--text-2);font-size:12px}
.modelp{background:var(--ok-soft)}
.modelp p{font-size:15px;line-height:1.7}
.modelp h4,.revp h4{margin:0 0 4px;font:800 13px/1.3 var(--font-ui)}
mark{background:color-mix(in oklab,var(--ok) 28%,transparent);color:inherit;padding:0 2px;border-radius:3px}
.revp{background:var(--rev-soft)}
.revnote{margin:0 0 6px;font-size:12px;color:var(--text-2)}
.revp .cnt{display:block;margin-top:4px;font-size:12px;color:var(--text-2)}
.quiz-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 2px 14px}
.textlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--text-2);font:600 13px/1 var(--font-ui);text-decoration:none}
.textlink svg{width:20px;height:20px}
.textlink .yt-body{fill:currentColor}.textlink .yt-play{fill:var(--surface-0)}
.textlink:is(:hover,:focus-visible){color:var(--text-1)}
.textlink:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.textlink:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}

/* 창 */
.toast{position:fixed;left:50%;top:calc(var(--top-h) + 10px);transform:translateX(-50%);z-index:60;max-width:min(380px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-2);background:var(--text-1);color:var(--surface-0);font-size:13px;line-height:1.5;box-shadow:var(--shadow-3)}
.toast.error{background:var(--danger-soft);color:var(--text-1);border:1px solid var(--danger)}
.toast-act{flex:none;min-height:32px;padding:0 10px;border:1px solid currentColor;border-radius:var(--r-1);background:transparent;font:700 13px/1 var(--font-ui);cursor:pointer}
.toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer}
dialog{padding:0;border:1px solid var(--line-2);border-radius:var(--r-3);background:var(--surface-1);color:var(--text-1);width:min(560px,calc(100% - 32px));max-height:88dvh;box-shadow:var(--edge-hi),var(--shadow-3)}
dialog.wide{width:min(740px,calc(100% - 32px))}
dialog::backdrop{background:var(--scrim)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--line-1)}
.dialog-head h2{font:800 18px/1.35 var(--font-ui);margin-right:auto}
.dialog-body{padding:16px 20px 20px;max-height:calc(88dvh - 58px);overflow:auto;overscroll-behavior:contain}
.dialog-body p{margin:0 0 10px;line-height:1.7}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.dialog-actions.start{justify-content:flex-start}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.txt{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--text-2)}
label.txt input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
fieldset.opts{margin:12px 0 0;padding:8px 12px 4px;border:1px solid var(--line-1);border-radius:var(--r-2)}
fieldset.opts legend{padding:0 6px;font:800 13px/1 var(--font-ui)}
.wipe-list{margin:0 0 10px;padding-left:20px;line-height:1.7}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:clamp(360px,34vw,470px);border-radius:var(--r-3) 0 0 var(--r-3);border-right:0}
dialog.drawer .dialog-body{max-height:calc(100dvh - 58px);padding-top:4px}
dialog.drawer::backdrop{background:color-mix(in oklab,var(--scrim) 45%,transparent)}
:is(dialog,[popover]).sheet{opacity:0;transform:translateY(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open],[popover]:popover-open).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open],[popover]:popover-open).sheet{opacity:0;transform:translateY(var(--lift))}}
dialog.drawer.sheet{--lift:0px}
.dh-btn{min-height:32px;padding:0 9px;font-size:12px}
.help-doc h3{font:800 15px/1.35 var(--font-ui);margin:16px 0 6px}
.help-doc h3:first-child{margin-top:0}
.help-doc ol,.help-doc ul{margin:0;padding-left:20px;font-size:13px;line-height:1.7}
.help-doc p{font-size:13px}
.help-doc .keys{line-height:2.1}
.brandblock{padding:10px 12px;border-radius:var(--r-2);background:var(--surface-0);font-size:13px;line-height:1.7}
.brandblock a{color:var(--text-1)}
.ver-line{color:var(--text-2);font-size:12px!important}
.th-card{padding:14px 0 18px;border-bottom:1px solid var(--line-1)}
.th-card h3{font:800 18px/1.35 var(--font-ui);margin:0 0 8px}
.th-svg{display:block;width:100%;height:auto;margin:4px 0 10px;background:var(--stage);border-radius:var(--r-2)}
.th-t{font:600 13px var(--font-ui);fill:var(--text-1)}
.th-b{font:800 15px var(--font-ui);fill:var(--text-1)}
.th-fig{position:relative;height:220px;margin:4px 0 10px;background:var(--stage);border-radius:var(--r-2);overflow:hidden}
.th-fig>svg{position:absolute;inset:0;width:100%;height:100%}
.th-def{font-weight:600;margin:0 0 6px;line-height:1.65}
.th-card ul{margin:0;padding-left:18px;font-size:15px;line-height:1.65}
.th-card .more{margin-top:8px;font-size:13px}
.th-card .more summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
.th-link{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--field);background:var(--field-soft);font-size:13px;line-height:1.55}

/* 장면 SVG 글자 — 화면 px 그대로(viewBox = 실제 px) */
.scene{touch-action:none;user-select:none;-webkit-user-select:none}
.scene text{font-family:var(--font-ui)}
.scene .vlabel{font-size:14px;font-weight:800;paint-order:stroke;stroke:var(--stage);stroke-width:4px;stroke-linejoin:round}
.scene .pole{font-size:22px;font-weight:900;paint-order:stroke;stroke:var(--stage);stroke-width:4px}
.scene .polechip{font-size:12px;font-weight:900;fill:var(--on-pole)}
.scene .tick{font-size:12px;font-weight:600;fill:var(--text-2)}
.scene .mark{font-size:15px;font-weight:800;fill:var(--text-1);paint-order:stroke;stroke:var(--stage);stroke-width:4px}
.scene .readout{font-size:16px;font-weight:800;fill:var(--text-1);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--stage);stroke-width:4px}
.scene .ghostlabel{font-size:12px;font-weight:700;fill:var(--text-3)}
.scene .term{font-size:12px;font-weight:800;fill:var(--text-2);paint-order:stroke;stroke:var(--stage);stroke-width:3px}
.scene .term.t-pos{fill:var(--lead-pos)}
.scene .inset-t{font-size:13px;font-weight:800;fill:var(--text-1)}
.scene .sup-t{font-size:12px;font-weight:700}
.scene .sup-s{font-size:11px;font-weight:700}
.scene .lcd{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.scene .lcd.sm{font-size:17px}
.scene .lcd-u{font-size:12px;font-weight:700}
.scene .lcd-cap{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.scene .knob,.scene .outbtn,.scene .hit{cursor:pointer}
.scene .grabbable{cursor:grab}
.scene .hit:focus{outline:none}
.mini-stage .scene .vlabel{font-size:12px}
.mini-stage .scene .pole{font-size:17px}
/* 반응형 */
@media (max-width:1180px){.lab-head .goal{flex-basis:100%}}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  .appbody{height:auto;min-height:calc(100dvh - var(--top-h))}
  .rail{position:sticky;top:0;height:calc(100dvh - var(--top-h))}
  main{overflow:visible}
  .lab{height:auto}
  .lab-grid{grid-template-columns:minmax(0,1fr)}
  .stage{flex:none;aspect-ratio:var(--ar,5/3)}
  .panel-scroll{overflow:visible}
  .panel-foot{position:sticky;bottom:0;z-index:5;box-shadow:0 -8px 20px -14px hsl(var(--shadow-color) / .6)}
  .panel{overflow:clip}
  .qbody{grid-template-columns:minmax(0,1fr)}
  figure.mini{position:static}
  .quiz-list{overflow:visible}
  .head-seg{margin-left:0}
  .stage>.scene{touch-action:pan-y}
}
@media (max-width:600px){
  :root{--top-h:52px}
  .topbar{gap:4px;padding:0 6px 0 8px}
  .brand{gap:4px}
  .brandmark{width:24px;height:24px}
  .word{font-size:12px}
  .brand .vdiv,.topbar>.vdiv,.top-title,.utilities .hsep,#reportBtn,#helpBtn{display:none}
  .social{width:36px;height:40px}
  .social::before{inset:-2px 4px}
  .social svg{width:19px;height:19px}
  .icon-btn{width:38px;height:40px}
  .icon-btn::before{inset:-2px 3px}
  .appbody{display:block;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:25;flex-direction:row;gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line-1)}
  .rail button{flex:1;min-height:54px;gap:3px;padding:6px 0}
  .rail button svg.ic{width:21px;height:21px}
  .rail button .l{display:none}
  .rail button .s{display:block}
  .rail button[aria-current="page"]::after{left:24%;right:24%;top:-4px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  main{padding:10px 0 16px}
  .lab{gap:8px}
  .lab-head{padding:0 12px}
  .lab-head h1{font-size:18px}
  .bench,.panel{border-radius:0;border-left:0;border-right:0}
  .lab-grid{gap:10px}
  .tool.save span{display:none}
  .tool.save{width:44px;height:44px;padding:0;justify-content:center}
  .bench-head{align-items:flex-start}
  .status{font-size:15px;padding:10px 12px}
  .panel-foot{bottom:calc(62px + env(safe-area-inset-bottom))}
  .quiz-list{padding:0 8px 8px}
  .qbody{padding:2px 8px 14px}
  .qcard summary{padding:10px}
  .badges{flex-basis:100%;justify-content:flex-start;order:3}
  .qcard summary{flex-wrap:wrap}
  .two-cols{grid-template-columns:1fr}
  .qbody{padding:2px 0 14px}
  figure.mini{border-radius:0;border-left:0;border-right:0}
  .qtext{padding:0 10px}
  dialog.drawer{width:100%;border-radius:0}
  .toast{top:auto;bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){.word{font-size:12px}.dirbtn{font-size:11px}}
/* 사용자 설정 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px}.chev{transition:none}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)}}
@media (prefers-reduced-transparency:reduce){.toast{box-shadow:none}}

/* 인쇄 */
.printview{display:none}
#offscreen{position:fixed;left:-10000px;top:0;width:640px;visibility:hidden;pointer-events:none}
@media print{
  @page{size:A4 portrait;margin:13mm 12mm}
  html,body{height:auto!important;overflow:visible!important;background:var(--surface-1)!important}
  body>*:not(.printview){display:none!important}
  .printview{display:block!important;color:var(--text-1)}
  .pv{font:400 10.5pt/1.55 var(--font-ui)}
  .pv-kick{margin:0;font-size:9pt;color:var(--text-2);font-weight:600}
  .pv h1{font:800 17pt/1.3 var(--font-ui);margin:2px 0 8px}
  .pv-id{display:flex;gap:18px;padding:6px 0;border-top:1.5px solid var(--text-1);border-bottom:1px solid var(--line-2);font-size:10.5pt}
  .pv-id.blank i{display:inline-block;width:110px;border-bottom:1px solid var(--text-1);margin-left:6px;height:14px}
  .pv-policy{margin:4px 0 0;font-size:9pt;color:var(--text-2)}
  .pv-sec{margin-top:14px}
  .pv-sec h2{font:800 12pt/1.3 var(--font-ui);margin:0 0 6px}
  .pv-t{width:100%;border-collapse:collapse;font-size:9.5pt}
  .pv-t th,.pv-t td{border:1px solid var(--line-2);padding:4px 6px;text-align:left;vertical-align:top}
  .pv-t td.num{text-align:right;white-space:nowrap}
  .pv-t.ws td{height:26px}
  .pv-q{break-inside:avoid;margin:12px 0 0;padding-top:8px;border-top:1px solid var(--line-2)}
  .pv-q h3{font:800 11pt/1.3 var(--font-ui);margin:0 0 4px}
  .pv-qq{margin:0 0 6px}
  .pv-fig{max-width:115mm;margin:4px 0 6px}
  .pv-fig svg{width:100%;height:auto}
  .pv .bg{display:none}
  .pv-tags{margin:0 0 4px;font-size:8.5pt;color:var(--text-2)}
  .pv-ans.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
  .pv-ans h4{font:800 9.5pt/1.3 var(--font-ui);margin:0 0 3px}
  .pv-ans>div{border:1px solid var(--line-2);border-radius:4px;padding:6px 8px}
  .pv-ans p{margin:0}

  { id: 'down', v: [0, -1, 0], name: '아래', long: '아래쪽' },
  { id: 'right', v: [1, 0, 0], name: '오른쪽', long: '오른쪽' },
  { id: 'left', v: [-1, 0, 0], name: '왼쪽', long: '왼쪽' },
  { id: 'front', v: [0, 0, 1], name: '앞', long: '앞쪽(나를 향해)' },

const LIGHT = V.norm([-.42, .82, .46]);                  // 광원: 왼쪽 위 앞 — 장면 전체에 하나

  set(e1, e2, instant) { const q = frameQuat(e1, e2); if (instant || reduceMotion) { this.q = this.from = this.to = q; this.t = 1; return; } this.from = this.q; this.to = q; this.t = 0; }
  step(dt) { if (this.t >= 1) return false; this.t = Math.min(1, this.t + dt / this.dur); this.q = slerp(this.from, this.to, ease(this.t)); return true; }
  get frame() { return quatFrame(this.q); }
  get moving() { return this.t < 1; }
}
/* ═════════ 오른손으로 코일 쥐기 — 네 손가락 = 전류가 흐르는 방향, 엄지 = 코일의 N극 ═════════
   축 A(엄지), R(축에서 손바닥 반대쪽), T = A × R. 네 손가락은 A를 축으로 오른나사 방향(T 쪽)으로 감긴다. */
function gripBasis(A, R) { const T = V.cross(A, R); return p => V.comb([0, 0, 0], [[A, p[0]], [R, p[1]], [T, p[2]]]); }
function gripRing(a,r,t0,t1,n) {return Array.from({length:n+1},(_,i)=>{const t=lerp(t0,t1,i/n);return [a,r*Math.cos(t),r*Math.sin(t)];});}
function buildGripHand(mode = 'coil') {
  const mesh=[],axes=[[1,0,0],[0,1,0],[0,0,1]];
  // The four fingers have separate MCP positions: no intersecting ten-millimetre spacing.
  handEllipsoid(mesh,[0,-29,-3],axes,[39,12,23]);
  handSweep(mesh,[[0,-40,-4],[0,-66,-6],[0,-88,-6]],19);
  handSweep(mesh,[[0,-87,-6],[0,-113,-6]],23,'--sleeve',3,18);
  [[28,7.8,2.28],[10,8.2,2.36],[-8,7.8,2.3],[-24,6.8,2.18]].forEach(([a,r,end])=>{
    const pts=gripRing(a,28,Math.PI*.98,Math.PI*end,6);
    handSweep(mesh,pts,r,'--skin',2,14);
    handNail(mesh,{pts,r,nail:[0,Math.cos(Math.PI*end),Math.sin(Math.PI*end)]});
  });
  handEllipsoid(mesh,[26,-26,8],axes,[19,12,16]);
  const thumb={pts:[[26,-26,9],[45,-27,10],[63,-27,10],[76,-27,10]],r:10,nail:[0,-1,0]};
  handSweep(mesh,thumb.pts,thumb.r);handNail(mesh,thumb);
  // Coil and hand share one depth-sorted surface list, including the hidden rear turns.
  if(mode === 'straight') handSweep(mesh,[[-105,0,0],[150,0,0]],7.5,'--wire',12,18);
  else for(let a=-42;a<=42;a+=7)handSweep(mesh,gripRing(a,16,0,Math.PI*2,20),2.3,'--wire',1,8);
  return mesh;
}
function drawGrip(D, o) {
  const W=gripBasis(o.axis,o.rad);
  if(!HAND_MESH.has('grip'))HAND_MESH.set('grip',buildGripHand());
  drawHandMesh(D,'grip',HAND_MESH.get('grip'),W,W);
  const tip=W([89,-27,10]);
  D.arrow(tip,V.madd(tip,o.axis,43),T('--pole-n'),{w:3,z:1e5,label:o.labels===false?'':'엄지 · N극',lcls:'vlabel',R:10,bg:'var(--stage)'});
  // Positive angle is always A × radius: the same handedness as the finger curl.
  const cp=gripRing(-43,40,.12*Math.PI,.9*Math.PI,18).map(W);
  D.line(cp,T('--cur'),3,{z:1e5-1});
  const e=cp.at(-1),dir=V.norm(V.sub(e,cp.at(-2)));
  D.arrow(cp.at(-2),V.madd(e,dir,7),T('--cur'),{w:3,z:1e5,head:11,dot:false,label:o.labels===false?'':'네 손가락 · 전류',lcls:'vlabel'});
}
function GRIP_FIT(axes) {
  if(!HAND_MESH.has('grip')) HAND_MESH.set('grip',buildGripHand());
  const W=gripBasis(axes[0],axes[1]);
  return HAND_MESH.get('grip').flatMap(f=>f.points).map(W).concat([W([139,-27,10]),...gripRing(-43,44,.12*Math.PI,.95*Math.PI,12).map(W)]);
}

/* Straight conductor: thumb = conventional current, curl = magnetic field.
   At every radius r, the field tangent is I-hat × r, including after reversal. */
function straightFieldPoint(W, a, angle) { return W([a,46*Math.cos(angle),46*Math.sin(angle)]); }
function drawStraightGrip(D, o) {
  const W=gripBasis(o.axis,o.rad);
  if(!HAND_MESH.has('straight')) HAND_MESH.set('straight',buildGripHand('straight'));
  drawHandMesh(D,'straight',HAND_MESH.get('straight'),W,W);
  // Separate short segments allow the rear half of each circle to be occluded.
  for(const a of [-72,112]) {
    const ring=gripRing(a,46,0,2*Math.PI,48).map(W);
    for(let j=0;j<48;j++) D.line([ring[j],ring[j+1]],T('--field'),2.1,{op:.85});
    for(const t of [0,.5*Math.PI,Math.PI,1.5*Math.PI]) {
      const tip=straightFieldPoint(W,a,t), tangent=W([0,-Math.sin(t),Math.cos(t)]);
      D.arrow(V.madd(tip,tangent,-26),tip,T('--field'),{w:2.5,head:9,dot:false,halo:false,
        label:'',lcls:'vlabel'});
    }
  }
  if(o.labels!==false) D.label(W([-72,62,0]),'자기장 B','vlabel',{fill:T('--field'),dy:6});
  const thumb=W([89,-27,10]);
  D.arrow(thumb,V.madd(thumb,o.axis,44),T('--cur'),{w:3,z:1e5,label:o.labels===false?'':'엄지 · 전류 I',lcls:'vlabel',R:10,bg:'var(--stage)'});
  // Current on the exposed straight wire runs parallel to the thumb.
  D.arrow(W([-99,0,0]),W([-53,0,0]),T('--cur'),{w:2.6,z:1e5,R:8,bg:'var(--stage)'});
}
function STRAIGHT_FIT(axes) {
  if(!HAND_MESH.has('straight')) HAND_MESH.set('straight',buildGripHand('straight'));
  const W=gripBasis(axes[0],axes[1]);
  return HAND_MESH.get('straight').flatMap(f=>f.points).map(W).concat([W([146,-27,10]),
    ...[-72,112].flatMap(a=>gripRing(a,50,0,2*Math.PI,32).map(W))]);
}

/* A large, keyboard-accessible view of the same meshes used in every experiment. */
function openHandModel() {
  const lab=cur.lab;
  let kind=lab?.gripPose?'grip':(lab?.s.kind||lab?.s.rule||'left');
  const initial=(lab?.gripPose||lab?.pose||lab?.hand)?.frame;
  let axes=initial?initial.slice(0,2).map(v=>v.slice()):[[0,1,0],[0,0,1]];
  const pose=new HandPose(...axes),cam=new Camera(lab?.cam.yaw??.6,lab?.cam.pitch??.35);
  let dirty=true,drag=null,raf=0,last=0;
  openModal('손 법칙 · 3D 모형', `<div class="chips" id="handModelKinds" role="group" aria-label="손 법칙 선택">
    <button class="btn small" data-hand-kind="left">플레밍 왼손</button><button class="btn small" data-hand-kind="right">오른손 · 힘</button><button class="btn small" data-hand-kind="grip">앙페르 · 코일</button><button class="btn small" data-hand-kind="straight">앙페르 · 직선 도선</button></div>
    <p class="help" id="handModelDescription" style="margin-top:12px"></p>
    <div id="handModelStage" style="height:clamp(240px,49dvh,530px);background:var(--stage);border:1px solid var(--line-2);border-radius:12px;overflow:hidden"></div>
    <p class="help">끌어서 손바닥·손등을 360° 확인하세요. 방향키: 회전 · Home: 처음 시점</p>
    <div class="chips"><button class="btn small" id="handModelCurrent">전류 방향 반대로</button><button class="btn small" id="handModelField">자기장 방향 반대로</button><button class="btn small" id="handModelHome">처음 시점</button></div>`,{
    wide:true,onOpen:()=>{
      const host=$('#handModelStage'),svg=makeSVG(host,'scene','손 법칙의 입체 모형. 끌거나 방향키로 회전할 수 있습니다.');
      svg.style.cssText='width:100%;height:100%;touch-action:none;cursor:grab';svg.setAttribute('tabindex','0');
      svg.setAttribute('role','group');
      const sync=()=>{
        $$('#handModelKinds button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.handKind===kind));
        $('#handModelDescription').textContent=kind==='straight'?'앙페르의 오른나사 법칙: 오른손 엄지를 직선 도선의 전류 I 방향으로 세우면, 감아쥔 네 손가락이 도선 주위 자기장 B의 방향을 나타냅니다. 전류를 뒤집으면 자기장도 반대로 돌아갑니다.':kind==='grip'?'오른손 네 손가락을 전류 방향으로 감으면 엄지가 코일의 N극, 즉 코일 내부 자기장 방향을 가리킵니다.':kind==='left'?'왼손 검지 = 자기장 B · 중지 = 전류 I · 엄지 = 힘 F. 세 방향은 서로 수직입니다.':'오른손 네 손가락 = 자기장 B · 엄지 = 전류 I · 손바닥이 향하는 쪽 = 힘 F. 코일을 감아쥐는 오른손 법칙과 구분하세요.';
        $('#handModelField').hidden=kind==='grip'||kind==='straight';dirty=true;
      };
      const home=()=>{cam.set(.62,.35);dirty=true;};
      $$('#handModelKinds button').forEach(b=>b.onclick=()=>{
        kind=b.dataset.handKind;axes=(kind==='grip'||kind==='straight')?[[0,1,0],[1,0,0]]:[[0,1,0],[0,0,1]];
        pose.set(...axes,true);home();sync();
      });
      $('#handModelCurrent').onclick=()=>{const i=(kind==='grip'||kind==='straight')?0:1;axes[i]=V.mul(axes[i],-1);pose.set(...axes);dirty=true;};
      $('#handModelField').onclick=()=>{axes[0]=V.mul(axes[0],-1);pose.set(...axes);dirty=true;};
      $('#handModelHome').onclick=home;
      svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch};svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';};
      svg.onpointermove=e=>{if(!drag)return;cam.set(drag.yaw-(e.clientX-drag.x)*.009,clamp(drag.pitch+(e.clientY-drag.y)*.007,-1.5,1.5));dirty=true;};
      svg.onpointerup=svg.onpointercancel=()=>{drag=null;svg.style.cursor='grab';};
      svg.onkeydown=e=>{
        const delta={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,.15],ArrowDown:[0,-.15]}[e.key];
        if(delta){e.preventDefault();e.stopPropagation();cam.set(cam.yaw+delta[0],clamp(cam.pitch+delta[1],-1.5,1.5));dirty=true;}
        if(e.key==='Home'){e.preventDefault();home();}
      };
      const ro=new ResizeObserver(()=>{dirty=true;});ro.observe(host);
      const draw=()=>{
        const {w,h}=sizeOf(host);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
        const fr=pose.frame,pad=w>480?92:22;
        fitPts(cam,kind==='straight'?STRAIGHT_FIT(fr):kind==='grip'?GRIP_FIT(fr):HAND_FIT(kind,...fr),{x:pad,y:30,w:w-2*pad,h:h-65});
        const D=new Draw3D(cam,'hand-model-');
        if(kind==='straight')drawStraightGrip(D,{axis:fr[0],rad:fr[1],labels:w>480});
        else if(kind==='grip')drawGrip(D,{axis:fr[0],rad:fr[1],labels:w>480});
        else drawHand(D,{kind,frame:fr,at:[0,0,0],labels:w>480,names:kind==='left'?['검지 · B','중지 · I','엄지 · F']:['네 손가락 · B','엄지 · I','손바닥 · F']});
        svg.innerHTML=D.svg();
      };
      const tick=t=>{
        if(!host.isConnected||!$('#modal').open){ro.disconnect();return;}
        const moving=pose.step(last?Math.min(.05,(t-last)/1000):0);last=t;
        if(dirty||moving){draw();dirty=false;}
        raf=requestAnimationFrame(tick);
      };
      $('#modal').addEventListener('close',()=>{cancelAnimationFrame(raf);ro.disconnect();},{once:true});
      sync();draw();raf=requestAnimationFrame(tick);
    }
  });
}

/* ═════════════════ 실험대 공통: 전원 장치 · 시점 · 손 규칙 창 · 입력 ═════════════════ */
class BenchLab {
  constructor(host, o, cfg) {
    this.o = o; this.cfg = cfg; this.mini = !!o.mini; this.host = host; this.uid = (o.id || '') + cfg.key;
    this.svg = makeSVG(host, 'scene', cfg.label);
    const st = o.state || {};
    this.s = Object.assign({ on: false, V: cfg.defV, rev: false, rule: 'left' }, cfg.state, st);
    this.s.show = Object.assign({}, cfg.show, st.show || {});
    this.view = o.view || 'oblique'; const v = cfg.views[this.view];
    this.cam = new Camera(v[0], v[1]); this.camT = 1; this.camFrom = v;
    this.flow = 0; this.drag = null; this.settleT = 0; this.settled = null; this.ghost = null; this.rec = {};
    this.onChange = o.onChange || (() => { }); this.onRecord = o.onRecord || (() => { });
    this.bindBase();
  }
  current() { return this.s.on ? this.s.V / this.cfg.R : 0; }
  Idir() { return this.s.rev ? -1 : 1; }
  changed() { this.onChange(this); }
  allowed(a) { return !this.o.lock || this.o.lock.includes(a); }
  setOn(v) { this.s.on = v; this.settleT = 0; this.changed(); }
  setV(v) { this.s.V = clamp(Math.round(v * 10) / 10, 0, this.cfg.Vmax); this.settleT = 0; this.changed(); }
  setRule(r) { this.s.rule = r; if(this.handAxes) { this.s.show.hand = true; this.s.show.force = true; this.resize(); } this.changed(); }
  setShow(k, v) { this.s.show[k] = v; if (k === 'hand') this.resize(); this.changed(); }
  setView(v) {
    if (!this.cfg.views[v]) return;
    this.camFrom = [this.cam.yaw, this.cam.pitch]; this.view = v; this.camT = reduceMotion ? 1 : 0;
    if (this.camT >= 1) this.cam.set(...this.cfg.views[v]); this.changed();
  }
  stepCam(dt) {
    if (this.camT >= 1) return false;
    this.camT = Math.min(1, this.camT + dt / .55); const e = ease(this.camT), [y0, p0] = this.camFrom, [y1, p1] = this.cfg.views[this.view];
    this.cam.set(lerp(y0, y1, e), lerp(p0, p1, e)); return true;
  }
  resize() {
    const { w, h } = sizeOf(this.host); this.W = w; this.H = h;
    this.svg.setAttribute('viewBox', `0 0 ${w} ${h}`); this.svg.setAttribute('width', w); this.svg.setAttribute('height', h);
    this.narrow = this.mini || w < 560; this.fitCam(this.cam);
  }
  hasHand() { return this.s.show.hand && !this.mini && this.cfg.hand !== false; }
  layout() {
    const w = this.W, h = this.H, hs = this.hasHand() && !this.handAxes, sup = this.cfg.supply !== false;
    if (!this.narrow) {
      const SUP = { x: 14, y: h - 14 - 132, w: 176, h: 132 }, HS = clamp(Math.min(w * .32, h * .48), 176, 270);
      const left = sup ? SUP.w + 30 : 12;
      return { sup: SUP, hand: { x: w - 14 - HS, y: 14, w: HS, h: HS }, fit: { x: left, y: 8, w: w - left - (hs ? HS + 26 : 12), h: h - 16 } };
    }
    const sw = this.mini ? 124 : 146, sh = this.mini ? 54 : 70, HS = clamp(w * .42, 136, 180);
    const top = (sup || hs) ? Math.max(sup ? sh : 0, hs ? HS : 0) + 10 : 6;
    return { sup: { x: 8, y: 8, w: sw, h: sh, compact: true }, hand: { x: w - 8 - HS, y: 8, w: HS, h: HS }, fit: { x: 6, y: this.mini ? (sup ? 20 : 6) : top, w: w - 12, h: h - (this.mini ? (sup ? 20 : 6) : top) - 6 } };
  }
  fitCam(cam) { this.L = this.layout(); if (this.s.show.direction) { this.L.fit.h = Math.max(70, this.L.fit.h - 86); this.L.sup.y = Math.max(8, this.L.sup.y - 86); } cam.fit(this.cfg.box, this.L.fit, 4); }
  softShadow(D, box) {
    const cam = this.cam, [a, b] = box, pts = [[a[0] - 10, 0, a[2] - 10], [b[0] + 10, 0, a[2] - 10], [b[0] + 10, 0, b[2] + 10], [a[0] - 10, 0, b[2] + 10]].map(p => cam.P(p));
    D.add(-1e5, `<polygon points="${pts.map(p => px(p.x + 4) + ',' + px(p.y + 7)).join(' ')}" fill="${rgb(C('--shadow-ink'), .22)}" filter="url(#soft-${this.uid})"/>`);
  }
  defsBase() { return `<filter id="soft-${this.uid}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter><filter id="glow-${this.uid}" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4"/></filter>`; }
  /* 받침 단자 두 개(왼쪽·오른쪽) — 금속 띠로 기둥과 이어진다 */
  drawTerminals(D, feet) {
    const metal = C('--metal-mid'), brass = C('--brass');
    for (const [tx, tz, fx, fz] of feet) {
      D.face([[fx - 5, 14.3, fz - 5], [fx + 5, 14.3, fz + 5], [tx + 5, 14.3, tz + 5], [tx - 5, 14.3, tz - 5]], metal, { n: [0, 1, 0], bias: -300 });
      D.cyl([tx, 14, tz], [tx, 26, tz], 7, brass, { n: 14 });
      D.cyl([tx, 26, tz], [tx, 31, tz], 4.5, shade(brass, .85), { n: 12 });
    }
  }
  /* 전원 장치(장면 속 2D 기구) + 집게 전선. terms = [왼쪽 단자, 오른쪽 단자](월드) — 처음 연결에서 (+)가 왼쪽 */
  drawSupply(terms) {
    if (this.cfg.supply === false) return '';
    const s = this.s, sp = this.L.sup, I = this.current(), cam = this.cam;
    const body = T('--supply'), edge = T('--supply-edge'), lcd = T('--lcd'), on = T('--lcd-on'), ink = T('--supply-ink');
    const tp = sp.compact ? { p: [sp.x + sp.w - 30, sp.y + sp.h - 10], n: [sp.x + sp.w - 13, sp.y + sp.h - 10] } : { p: [sp.x + sp.w - 64, sp.y + sp.h - 18], n: [sp.x + sp.w - 30, sp.y + sp.h - 18] };
    const tL = cam.P(terms[0]), tR = cam.P(terms[1]), to = s.rev ? { p: tR, n: tL } : { p: tL, n: tR };
    const wire = (a, b, col) => {
      const dx = b.x - a[0], sag = this.narrow ? 36 : 64, d = `M${px(a[0])} ${px(a[1])}C${px(a[0] + dx * .25)} ${px(a[1] + sag)} ${px(b.x - dx * .25)} ${px(b.y + sag)} ${px(b.x)} ${px(b.y)}`;
      return `<path d="${d}" fill="none" stroke="${rgb(shade(C(col), .55))}" stroke-width="${this.narrow ? 4 : 5.4}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${T(col)}" stroke-width="${this.narrow ? 2.4 : 3.4}" stroke-linecap="round"/>`;
    };
    let g = `<g class="leads">${wire(tp.n, to.n, '--lead-neg')}${wire(tp.p, to.p, '--lead-pos')}`;
    g += `<text x="${px(to.p.x)}" y="${px(to.p.y - 13)}" text-anchor="middle" class="term t-pos">(+)</text><text x="${px(to.n.x)}" y="${px(to.n.y - 13)}" text-anchor="middle" class="term">(−)</text></g>`;
    g += `<g class="supply"><rect x="${sp.x}" y="${sp.y}" width="${sp.w}" height="${sp.h}" rx="10" fill="${body}" stroke="${edge}" stroke-width="1.2"/>`;
    g += `<rect x="${sp.x + 2}" y="${sp.y + 1.5}" width="${sp.w - 4}" height="8" rx="6" fill="${T('--supply-hi')}" opacity=".3"/>`;
    const Vs = s.V.toFixed(1), As = I.toFixed(2);
    if (sp.compact) {
      g += `<rect x="${sp.x + 7}" y="${sp.y + 7}" width="${sp.w - 48}" height="${sp.h - 24}" rx="5" fill="${lcd}"/>`;
      g += `<text x="${sp.x + sp.w - 50}" y="${px(sp.y + 7 + (sp.h - 24) / 2 + 7)}" text-anchor="end" class="lcd sm" style="fill:${on}">${As}<tspan class="lcd-u" dx="2">A</tspan></text>`;
      g += `<text x="${sp.x + 9}" y="${sp.y + sp.h - 4}" class="lcd-cap" style="fill:${ink}">${Vs} V</text>`;
      g += this.outBtn(sp.x + sp.w - 36, sp.y + 7, 29, 22);
      g += `<circle cx="${tp.p[0]}" cy="${tp.p[1]}" r="4.5" fill="${T('--lead-pos')}" stroke="${edge}"/><circle cx="${tp.n[0]}" cy="${tp.n[1]}" r="4.5" fill="${T('--lead-neg')}" stroke="${edge}"/>`;
    } else {
      g += `<text x="${sp.x + 12}" y="${sp.y + 20}" class="sup-t" style="fill:${ink}">직류 전원 장치</text>`;
      g += `<rect x="${sp.x + 10}" y="${sp.y + 28}" width="98" height="62" rx="6" fill="${lcd}"/>`;

    D.label([0, CM.cy + 20, zf - 45], s.facingN ? 'S' : 'N', 'pole', { fill: T(s.facingN ? '--pole-s-ink' : '--pole-n-ink') });
    /* 거리 표시(받침 위) */

      D.add(-200, `<line x1="${px(a.x)}" y1="${px(a.y)}" x2="${px(b.x)}" y2="${px(b.y)}" stroke="${T('--text-2')}" stroke-width="1.2" stroke-dasharray="3 3"/>`);
      D.labelAt({ x: (a.x + b.x) / 2 + 6, y: (a.y + b.y) / 2 + 14 }, `${s.gap} mm`, 'tick', 'start');
    }
    if (s.show.field) {

        const m = Math.floor(pts.length * .45); if (m > 2) D.arrow(pts[m - 1], pts[m + 1], fc, { w: 1.4, head: 7, halo: false, dot: false, op: .9, bias: -30 });

    const f = this.frame(s.th), cu = C('--wire'), N = 32;

        D.add(Q.z + 1, `<g><circle cx="${px(Q.x)}" cy="${px(Q.y)}" r="10" fill="${col}" stroke="var(--stage)" stroke-width="2"/><text x="${px(Q.x)}" y="${px(Q.y + 4.5)}" text-anchor="middle" class="polechip">${p}</text></g>`);
      }

    if (s.show.cur && I > 0) {

      }

    const F = this.forceZ(s.th);
    if ((s.show.force || s.show.direction) && Math.abs(F) > 1e-4) {

      D.arrow(b, V.madd(b, [0, 0, Math.sign(F)], 22 + 700 * Math.abs(F)), T('--force'), { w: 4, z: 1e4 + 1, label: '힘', lcls: 'vlabel', R: 12, bg: 'var(--stage)' });
    }
    if (Math.abs(s.th) > .003 || s.on) {
      const p = cam.P([0, CM.pivotY + 16, 0]);
      D.labelAt({ x: p.x, y: p.y - 4 }, `${(Math.abs(s.th) * 180 / Math.PI).toFixed(1)}°`, 'readout', 'middle');
    }
    let body = D.svg() + this.drawSupply([[-105, 31, 62], [105, 31, 62]]);
    if (this.hasHand()) body += this.gripInset();
    const hp = [-1, 1].flatMap(x => [-1, 1].flatMap(y => [0, -60].map(dz => { const q = cam.P([x * 12, CM.cy + y * 12, zf + dz]); return [q.x, q.y]; })));
    if (this.allowed('mdrag')) body += `<polygon class="hit grabbable" data-act="mdrag" points="${hull2(hp).map(p => px(p[0]) + ',' + px(p[1])).join(' ')}" fill="transparent"><title>자석: 누르면 극이 바뀌고, 끌면 거리가 바뀌어요</title></polygon>`;
    this.svg.innerHTML = `<defs>${this.defsBase()}</defs>` + body;
  }
  gripInset() {
    const axes = this.gripPose.frame;            // 엄지 = 코일의 N극 쪽, 팔은 오른쪽에서
    return this.handInset(this.L.hand.w < 210 ? '오른손 법칙 · 코일' : '앙페르 오른손 법칙 · 코일', GRIP_FIT(axes), (D, b) => drawGrip(D, { axis: axes[0], rad: axes[1], labels: false }), [['네 손가락 → 전류', '--cur'], ['엄지 → N극 (코일 내부 B)', '--pole-n-ink']]);

}

/* ═════════════════ ③ 알루미늄 포일 — 말굽자석 사이 도선(더 해 보기) ═════════════════
   포일 띠(길이 150 mm)가 서 있는 말굽자석의 두 극 사이를 지난다. 두 극 사이 자기장은 앞뒤 방향.
   교육용 모형: 포일 가운데가 받는 힘에 비례해 휘어지고(최대 ±22 mm), 가벼워서 금방 멈춘다. */
const FO = { R: 4, Vmax: 6, B: .12, ell: .025, gain: 4400, max: 24, clampX: 78, y: 104 };
class FoilLab extends BenchLab {
  constructor(host, o = {}) {
    super(host, o, {
      key: 'fo', label: '알루미늄 포일 실험 장면: 서 있는 말굽자석의 두 극 사이로 알루미늄 포일 띠가 지나간다', R: FO.R, Vmax: FO.Vmax, defV: 4,
      views: { oblique: [.55, .3], front: [0, .06], side: [Math.PI / 2, .06] }, box: [[-120, 0, -75], [120, 140, 95]],
      state: { flip: false, y: 0, vy: 0 }, show: { field: true, cur: true, force: true, hand: false },
    });
    this.fade = 1; this.hand = new HandPose(...this.handAxes()); this.resize();
  }
  Bz() { return this.s.flip ? 1 : -1; }                           // 처음: N극이 앞(+z) → 자기장은 뒤쪽(−z)
  forceY() { return FO.ell * FO.B * this.current() * this.Idir() * (-this.Bz()) * (this.fade >= 1 ? 1 : 0); }
  handAxes() { return [[0, 0, this.Bz()], [this.Idir(), 0, 0]]; }
  step(dt) {
    let act = this.stepCam(dt); const s = this.s;
    if (this.fade < 1) { const f0 = this.fade; this.fade = Math.min(1, this.fade + dt / .7); if (f0 < .5 && this.fade >= .5) { s.flip = !s.flip; this.hand.set(...this.handAxes()); } act = true; if (this.fade >= 1) this.changed(); }
    if (this.hand.step(dt)) act = true;
    const target = clamp(this.forceY() * FO.gain, -FO.max, FO.max);           // 1.5 A에서 약 20 mm
    const w = 13, z = .32; let t = dt;
    while (t > 1e-6) { const k = Math.min(1 / 240, t); t -= k; const a = w * w * (target - s.y) - 2 * z * w * s.vy; s.vy += a * k; s.y += s.vy * k; }
    const moving = Math.abs(s.vy) > .05 || Math.abs(s.y - target) > .05; if (moving) act = true;
    this.settleT = moving ? 0 : this.settleT + dt;
    if (this.settleT > .3 && s.on && this.current() > 0) this.record();
    if (s.on && this.current() > 0) { this.flow += this.current() * 42 * dt; act = true; }
    return act;
  }
  record() {
    const s = this.s, key = `${this.Idir()}|${s.flip ? 1 : 0}`, res = { dir: s.y > 0 ? '위' : '아래', mm: r1(Math.abs(s.y)), key, I: this.current() };
    const p = this.settled; if (p && p.key === key && Math.abs(p.mm - res.mm) < .2) return;
    this.settled = res; this.rec[key] = res; this.onRecord(res); this.changed();
  }
  reverse() { this.s.rev = !this.s.rev; this.settleT = 0; this.hand.set(...this.handAxes()); this.changed(); }
  flipMagnet() { if (this.fade < 1) return; this.fade = 0; this.settleT = 0; this.changed(); }
  reset() { Object.assign(this.s, { on: false, V: 4, rev: false, flip: false, y: 0, vy: 0 }); this.fade = 1; this.settled = null; this.rec = {}; this.hand.set(...this.handAxes()); this.changed(); }
  active() { return this.camT < 1 || this.fade < 1 || this.hand.moving || Math.abs(this.s.vy) > .05 || (this.s.on && this.current() > 0) || Math.abs(this.s.y) > .05; }
  onAct(act) { if (act === 'flip') { this.flipMagnet(); return true; } return false; }
  observe() {
    const s = this.s, I = this.current();
    if (this.fade < 1) return { obs: '말굽자석을 돌려 N극과 S극의 위치를 바꾸고 있어요.', ex: '' };
    if (s.on && I === 0) return { obs: '전압이 0 V라 포일에 전류가 흐르지 않아요.', ex: '전압 손잡이를 돌려 보세요.' };
    if (!s.on) return { obs: Math.abs(s.y) > .5 ? '전류가 끊기자 포일이 제자리로 돌아가요.' : '스위치를 켜서 포일이 어느 쪽으로 휘는지 보세요.', ex: '자석을 누르면 N극과 S극의 위치가 바뀌어요.' };
    const up = this.forceY() > 0;
    return { obs: `포일 가운데가 ${up ? '위로 들려' : '아래로 눌려'} ${Math.abs(s.y).toFixed(1)} mm 휘었어요.`, ex: `전류 ${I.toFixed(2)} A · N극이 ${s.flip ? '뒤' : '앞'}쪽` };
  }
  status() {
    const s = this.s, I = this.current();
    return { cond: `전압 ${s.V.toFixed(1)} V · 전류 ${I.toFixed(2)} A · 전류 방향 ${s.rev ? '반대' : '처음'} · N극이 ${s.flip ? '뒤' : '앞'}쪽`, state: s.on && I > 0 ? `포일 가운데가 ${this.forceY() > 0 ? '위' : '아래'}로 ${Math.abs(s.y).toFixed(1)} mm 휨` : '전류가 흐르지 않아 포일이 그대로 있음' };
  }
  foilY(x) {

  draw() {
    const s = this.s, cam = this.cam; this.fitCam(cam);

    this.softShadow(D, base); drawBase(D, base);
    this.drawTerminals(D, [[-105, 62, -FO.clampX - 6, 0], [105, 62, FO.clampX + 6, 0]]);
    const metal = C('--metal-mid');
    for (const x of [-FO.clampX - 6, FO.clampX + 6]) {
      D.box([x, 17, 0], [22, 6, 22], metal); D.rod([x, 20, 0], [x, FO.y - 6, 0], 4.5, metal, { seg: 3 });
      D.box([x, FO.y - 2, 0], [14, 10, 16], C('--clip'));
    }

    const op = this.fade < 1 ? Math.abs(1 - 2 * this.fade) : 1, nUp = !s.flip ? true : false;
    drawUMagnet(D, { Wp: (x, u, v) => [x, 14 + 30 + u, v], Wd: (x, u, v) => [x, u, v], X: 12.5, zc: 0, zt: 78, ri: 14, ro: 30, nUp: this.fade < .5 ? !s.flip : nUp, op });
    if (s.show.field && this.fade >= 1) {
      const fc = T('--field'), z0 = s.flip ? -14 : 14, z1 = -z0;
      for (const x of [-8, 0, 8]) for (const y of [62, 82, 102]) D.arrow([x, y, z0], [x, y, z1], fc, { w: 1.5, head: 7, halo: false, dot: false });
      const l = cam.P([14, 64, 0]); D.labelAt({ x: l.x + 8, y: l.y + 4 }, '자기장', 'vlabel', 'start', fc);
    }
    /* 포일 띠(폭 10 mm) */
    const al = C('--foil'), xs = []; for (let x = -FO.clampX; x <= FO.clampX + .1; x += 6) xs.push(x);
    for (let i = 0; i < xs.length - 1; i++) {
      const a = xs[i], b = xs[i + 1], ya = this.foilY(a), yb = this.foilY(b);
      D.face([[a, ya, -5], [b, yb, -5], [b, yb, 5], [a, ya, 5]], al, { cull: false, n: V.norm([-(yb - ya), b - a, 0]), stroke: rgb(shade(al, .6)), sw: .6 });

    const I = this.current();
    if (s.show.cur && I > 0) {
      const path = [[-105, 30, 62], [-FO.clampX - 6, 17, 0], [-FO.clampX - 6, FO.y, 0]].concat(xs.map(x => [x, this.foilY(x) + 1, 0]), [[FO.clampX + 6, FO.y, 0], [FO.clampX + 6, 17, 0], [105, 30, 62]]);
      drawFlow(D, this.Idir() > 0 ? path : path.reverse(), this.flow, cam, this.narrow ? 2.2 : 2.7);
      const y = this.foilY(-45) + 12;
      D.arrow([-60 * this.Idir(), y, 0], [-30 * this.Idir(), y, 0], T('--cur'), { w: 3, z: 1e4, label: '전류', lcls: 'vlabel' });
    }
    const F = this.forceY();
    if ((s.show.force || s.show.direction) && Math.abs(F) > 1e-5) {
      const b = [0, this.foilY(0) + Math.sign(F) * 4, 0];
      D.arrow(b, V.madd(b, [0, Math.sign(F), 0], 24 + 9000 * Math.abs(F)), T('--force'), { w: 4, z: 1e4 + 1, label: '힘', lcls: 'vlabel' });
    }
    let body = D.svg() + this.drawSupply([[-105, 31, 62], [105, 31, 62]]);
    if (this.hasHand()) body += this.sceneHand([0,this.foilY(0),0], this.handAxes());
    const hp = [-1, 1].flatMap(x => [[0, -30], [0, 30], [108, -30], [108, 30]].map(([u, v]) => { const q = cam.P([x * 12.5, 14 + u, v]); return [q.x, q.y]; }));

    this.svg.innerHTML = `<defs>${this.defsBase()}</defs>` + body;
  }
}

/* ═════════════════ ③ 전동기 원리 — 두 자석 사이에서 도는 네모 코일 + 정류자 ═════════════════
   좌표 mm: 회전축 = z(관찰자 쪽), 축 높이 y0. 처음: N극이 왼쪽 → 자기장은 오른쪽(+x).
   코일의 긴 두 변(길이 L, z 방향)이 축에서 r만큼 떨어져 돈다. 한 변이 받는 힘 F = N·I·L·B (방향은 전류·자기장에 모두 수직).
   회전력 τ = (두 변의 r × F) → τ = K(φ)·I. 정류자는 코일이 반 바퀴 돌 때마다(코일 면이 자기장에 수직일 때) 코일 속 전류 방향을 바꾼다.
   교육용 모형: 바퀴처럼 무거운 부하가 달려 천천히 돈다(점성 저항 b, 정지 마찰 τc). 역기전력 e = K(φ)·ω 도 넣었다. */
const MO = {
  R: 2, Vmax: 6, L: .070, r: .030, Bn: .20, Bs: .32, Nturn: [10, 20], J: 3e-4, b: 1.07e-3, tc: 2e-4, gap: 3 * Math.PI / 180,
  y0: 58, zc: 58, rc: 9, zs: 35, rmm: 30, faceX: 44, magW: 26, magH: 80, magD: 56,
};
class MotorLab extends BenchLab {
  constructor(host, o = {}) {
    super(host, o, {
      key: 'mo', label: '전동기 실험 장면: 왼쪽과 오른쪽 자석 사이에서 네모 코일이 회전축에 꽂혀 돌고, 앞쪽 정류자에 두 브러시가 닿아 있다', R: MO.R, Vmax: MO.Vmax, defV: 4,
      views: { oblique: [.4, .62], front: [0, .06], top: [0, 1.25] }, box: [[-100, 0, -56], [100, 112, 96]],
      state: { flip: false, strong: false, turns: 0, comm: true, assist: true, phi: .35, om: 0 }, show: { field: true, cur: true, force: true, poles: false, hand: false },
    });
    this.stallTime = 0; this.assistNotice = 0; this.rot = 0; this.revs = 0; this.spd = 0; this.hand = new HandPose(...this.handAxes()); this.resize();
  }
  Bx() { return this.s.flip ? -1 : 1; }                              // 자기장 방향(x 성분)
  B0() { return this.s.strong ? MO.Bs : MO.Bn; }
  N() { return MO.Nturn[this.s.turns]; }
  u(phi) { return [Math.cos(phi), Math.sin(phi), 0]; }
  /* 지금 (+)단자에 이어진 브러시에서 들어간 전류가 변 ①(u 쪽)을 흐르는 방향: +1 = 앞(+z)으로, −1 = 뒤로, 0 = 끊김 */
  side1Sign(phi) {
    const c = Math.cos(phi), s = this.s, plusLeft = !s.rev;               // 처음 연결: (+)가 왼쪽 단자·왼쪽 브러시
    if (s.comm) {
      if (Math.abs(c) < Math.sin(MO.gap)) return 0;                      // 브러시가 정류자 틈에 걸림
      const segAleft = c < 0;                                            // 변 ①에 이어진 반쪽 고리 A가 왼쪽 브러시에 닿음
      return (segAleft === plusLeft) ? -1 : 1;                           // A로 들어간 전류는 변 ①을 앞→뒤(−z)로 흐른다
    }
    return plusLeft ? 1 : -1;                                            // 정류자 없이 고리: A는 늘 오른쪽 브러시
  }
  K(phi) {                                                               // 회전력 / 전류 (N·m/A), 들어가는 전류가 (+)일 때
    const sg = this.side1Sign(phi); if (!sg) return 0;
    return this.N() * this.B0() * MO.L * 2 * MO.r * Math.cos(phi) * sg * this.Bx();
  }
  current() {
    if (!this.s.on) return 0;
    const k = this.K(this.s.phi); if (this.s.comm && this.side1Sign(this.s.phi) === 0) return 0;
    return Math.max(0, (this.s.V - k * this.s.om) / MO.R);
  }
  handAxes() {
    const s = this.s, sg = this.side1Sign(s.phi) || 1, c = Math.cos(s.phi);
    const right = c >= 0 ? sg : -sg;                                    // 오른쪽에 있는 변의 전류(z) 부호
    return [[this.Bx(), 0, 0], [0, 0, right]];
  }
  step(dt) {
    let act = this.stepCam(dt); const s = this.s;
    if (this.hand.step(dt)) act = true;
    // A single-coil motor cannot self-start at its dead centre. Optional, explicit
    // mechanical starting assistance supplies a push; it is not magnetic torque.
    this.assistNotice = Math.max(0, this.assistNotice - dt);
    const stalled = s.on && s.comm && s.V >= .5 && Math.abs(s.om) < .05;
    this.stallTime = stalled ? this.stallTime + dt : 0;
    if (s.assist && this.stallTime > .7) { this.nudge(); this.assistNotice = 2; this.stallTime = 0; }
    const h = 1 / 480; let t = dt;
    while (t > 1e-6) {
      const k = Math.min(h, t); t -= k;
      const I = this.current(), tq = this.K(s.phi) * I - MO.b * s.om;
      if (Math.abs(s.om) < .05 && Math.abs(tq) < MO.tc) { s.om = 0; continue; }
      const fr = s.om !== 0 ? -Math.sign(s.om) * MO.tc : -Math.sign(tq) * MO.tc;
      const om0 = s.om; s.om += (tq + fr) / MO.J * k;
      if (om0 !== 0 && Math.sign(om0) !== Math.sign(s.om) && Math.abs(tq) < MO.tc) s.om = 0;
      s.phi += s.om * k; this.revs += s.om * k / (Math.PI * 2);
    }
    s.phi = ((s.phi % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    this.spd = lerp(this.spd, s.om / (Math.PI * 2), Math.min(1, dt * 3));
    const I = this.current();
    if (I > 0) { this.flow += I * 30 * dt; act = true; }
    if (Math.abs(s.om) > 1e-3) act = true;
    const a = this.handAxes(); if (this.s.show.hand && (a[1][2] !== this.lastR || a[0][0] !== this.lastB)) { this.lastR = a[1][2]; this.lastB = a[0][0]; this.hand.set(...a); }

function theoryFigure(id, host) {
  const opt = { mini: true, id: 'th' + id, lock: [] };
  let L;
  if (id === 'swing') { L = new SwingLab(host, { ...opt, state: { on: true, V: 4 } }); }
  else if (id === 'coil') { L = new CoilMagLab(host, { ...opt, state: { on: true, V: 4 } }); L.s.show.poles = true; }
  else if (id === 'motor') { L = new MotorLab(host, { ...opt, state: { on: true, V: 4, phi: .5 } }); L.s.show.poles = true; }
  else if (id === 'rule') { L = new RuleLab(host, { ...opt, noHand: false, state: { B: 'right', I: 'back', shown: true } }); }
  if (!L) return null;
  if (L.cfg) L.cfg.supply = false;
  L.resize();
  if (id === 'motor') { L.flow = 5; } else for (let i = 0; i < 300; i++) L.step(1 / 60);
  if (id === 'rule') { L.disp = 18; L.pose.t = 1; L.pose.q = L.pose.to; }
  L.draw(); return L;
}

const DIR_IDS = ['up', 'down', 'left', 'right', 'front', 'back'];
function makeQuiz() {
  const all = []; DIR_IDS.forEach(b => DIR_IDS.forEach(i => { if (forceDir(b, i)) all.push({ B: b, I: i }); }));
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  return { list: all.slice(0, 8), k: 0, score: 0, done: [] };
}

}

function ruleCheck() {

function learnSummary() {
  const items = [], r = records;

  const n = Object.keys(r.swing).length + Object.keys(r.foil).length + Object.keys(r.coil).length + r.motor.length + r.swingI.length;
  if (n) items.push(`실험 기록 ${n}줄`);
  if (r.rule.tries.length) items.push(`왼손 법칙 푼 기록 ${r.rule.tries.length}개`);
  if (Object.values(answers).some(v => v)) items.push('처음 쓴 답안');
  if (Object.values(revisions).some(v => v)) items.push('다시 쓴 답안');
  if (Object.keys(locks).length) items.push('모범 답안 잠금');
  if (Object.keys(hints).length) items.push('힌트 기록');

}

  if (student.asked && (!need || (student.sid && student.name))) { cb(); return; }
  openModal(need ? '학번과 이름을 적어 주세요' : '결과 이미지에 이름을 넣을까요?', `
    <div class="two-cols"><label class="txt">학번<input type="text" id="sidIn" inputmode="numeric" autocomplete="off" value="${esc(student.sid)}"></label><label class="txt">이름<input type="text" id="nameIn" autocomplete="off" value="${esc(student.name)}"></label></div>
    <label class="check"><input type="checkbox" id="keepIn" ${student.keep ? 'checked' : ''}> 이 기기에서 다음 시간에도 이어하기</label>
    <p class="help">정보는 서버로 전송되지 않아요. 기본적으로 현재 브라우저 세션에서만 사용하며, ‘이 기기에서 이어하기’를 선택한 경우에만 이 기기에 저장됩니다.</p>
    <p class="fb bad" id="sidMsg"></p>
    <div class="dialog-actions">${need ? '<button class="btn" data-close>취소</button>' : '<button class="btn" id="noName">이름 없이 저장</button>'}<button class="btn primary" id="sidOk">${need ? '확인' : '저장'}</button></div>`, {
    onOpen: () => {
      const done = withName => {
        const sid = $('#sidIn').value.trim(), name = $('#nameIn').value.trim(), kp = $('#keepIn').checked;
        if (withName && need && (!sid || !name)) { $('#sidMsg').textContent = '리포트에는 학번과 이름이 모두 필요해요.'; return; }
        const hadP = kp && sid && (() => { try { return localStorage.getItem(KEY('p-' + sid)); } catch (e) { return null; } })();
        student = { sid: withName ? sid : '', name: withName ? name : '', asked: true, keep: kp && withName && !!sid };
        store.set('student', student); closeModal();
        if (hadP && !Object.values(answers).some(v => v)) toast('이 기기에 남긴 지난 기록이 있어요.', { action: '지난 기록 이어하기', onAction: () => restoreKept(sid) });
        cb();
      };
      $('#sidOk').onclick = () => done(true);
      const nn = $('#noName'); if (nn) nn.onclick = () => done(false);
      ['#sidIn', '#nameIn'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } }));
      setTimeout(() => $('#sidIn').focus(), 30);
    },
  });
}
function restoreKept(sid) {
  try {
    const b = JSON.parse(localStorage.getItem(KEY('p-' + sid)) || '{}');
    LEARN_KEYS.forEach(k => { if (b[k] != null) sessionStorage.setItem(KEY(k), JSON.stringify(b[k])); });
    records = Object.assign(emptyRecords(), store.get('records', {}));
    answers = onlyQ(store.get('answers', {})); revisions = onlyQ(store.get('revisions', {})); locks = onlyQ(store.get('locks', {})); hints = onlyQ(store.get('hints', {})); seen = onlyQ(store.get('seen', {}));
    go(S.screen); toast('지난 기록을 불러왔어요.');
  } catch (e) { toast('지난 기록을 불러오지 못했어요. 새로 시작해도 실험은 그대로 할 수 있어요.', { error: true }); }
}

/* ═══════════ 결과 저장 (PNG) ═══════════ */
const INLINE_PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'font-family', 'font-size', 'font-weight', 'text-anchor', 'paint-order', 'stop-color', 'stop-opacity', 'display', 'visibility', 'font-variant-numeric'];
function inlineTree(src, dst) {
  if (src.nodeType !== 1) return;
  const cs = getComputedStyle(src); let st = '';
  for (const p of INLINE_PROPS) { const v = cs.getPropertyValue(p); if (v !== '') st += `${p}:${v};`; }
  dst.setAttribute('style', st); dst.removeAttribute('class');
  const a = src.children, b = dst.children;
  for (let i = 0; i < a.length && i < b.length; i++) inlineTree(a[i], b[i]);
}
function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
async function capture() {
  if (!isBench() || !cur.lab) return;
  const btn = $('#saveBtn'); if (btn.getAttribute('aria-busy') === 'true') return;
  askStudent('png', async () => {
    btn.setAttribute('aria-busy', 'true');
    const slow = setTimeout(() => toast('결과 이미지를 만드는 중이에요…'), 700);
    try {
      const L = cur.lab; L.draw();
      const lines = L.status(), title = S.screen === 'swing' && S.swingMode === 'foil' ? '알루미늄 포일' : SCREEN_BY[S.screen].title;
      const svg = L.svg, clone = svg.cloneNode(true);
      inlineTree(svg, clone);
      const vb = svg.viewBox.baseVal, k0 = Math.min(2400, Math.max(1200, vb.width * 2)) / vb.width;
      const outW = Math.round(vb.width * k0), outH = Math.round(vb.height * k0);
      clone.setAttribute('width', outW); clone.setAttribute('height', outH); clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
      clone.insertAdjacentHTML('afterbegin', `<rect width="100%" height="100%" fill="${tok('--stage')}"/>`);
      const data = new XMLSerializer().serializeToString(clone).replace(/var\(--stage\)/g, tok('--stage'));
      const url = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image(); await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
      const k = outW / 1200, pad = 28 * k, font = n => `${n}px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
      ctx.font = `500 ${font(17 * k)}`;
      const rightW = 330 * k, textW = outW - pad * 3 - rightW;
      const condL = wrapText(ctx, lines.cond, textW), stateL = wrapText(ctx, lines.state, textW);
      const bandH = pad * 2 + (20 + 28) * k + (condL.length + stateL.length) * 26 * k;
      cv.width = outW; cv.height = outH + bandH;
      ctx.fillStyle = tok('--surface-1'); ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, outW, outH); URL.revokeObjectURL(url);
      ctx.fillStyle = tok('--line-2'); ctx.fillRect(0, outH, outW, Math.max(1, k));
      let y = outH + pad + 14 * k;
      ctx.fillStyle = tok('--text-2'); ctx.font = `600 ${font(14 * k)}`; ctx.fillText('실험 결과 · 송쌤과학 가상실험실', pad, y);
      y += 30 * k; ctx.fillStyle = tok('--text-1'); ctx.font = `800 ${font(22 * k)}`; ctx.fillText(`${LAB_TITLE} — ${title}`, pad, y);
      ctx.font = `500 ${font(17 * k)}`; ctx.fillStyle = tok('--text-1');
      for (const l of condL) { y += 26 * k; ctx.fillText(l, pad, y); }
      ctx.fillStyle = tok('--text-2'); for (const l of stateL) { y += 26 * k; ctx.fillText(l, pad, y); }
      const now = new Date(), p2 = n => String(n).padStart(2, '0');
      const stamp = `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
      ctx.textAlign = 'right'; let ry = outH + pad + 14 * k; const rx = outW - pad;
      ctx.fillStyle = tok('--text-1'); ctx.font = `700 ${font(17 * k)}`;
      if (student.sid || student.name) { ctx.fillText(`학번 ${student.sid || '-'} · 이름 ${student.name || '-'}`, rx, ry + 16 * k); ry += 30 * k; }
      ctx.fillStyle = tok('--text-2'); ctx.font = `500 ${font(15 * k)}`; ctx.fillText(stamp, rx, ry + 16 * k); ry += 26 * k;
      ctx.fillText('© 송쌤과학 · @songsamscience', rx, ry + 16 * k); ctx.textAlign = 'left';
      const blob = await new Promise(ok => cv.toBlob(ok, 'image/png')); if (!blob) throw new Error('blob');
      const stampF = `${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}-${p2(now.getHours())}${p2(now.getMinutes())}`;
      const fname = [LAB_FILE, '실험결과', student.sid, student.name, stampF].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]/g, '') + '.png';
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      if (!REDUCED) { const f = document.createElement('div'); f.className = 'shutter'; $('#stage').appendChild(f); setTimeout(() => f.remove(), 340); }
      clearTimeout(slow); toast(`실험 결과를 PNG로 저장했어요 — ${fname}`);
      window.__lastCapture = { fname, w: cv.width, h: cv.height, url: cv.toDataURL('image/png') };
    } catch (e) {
      clearTimeout(slow); console.error(e);
      toast('이미지로 저장하지 못했어요. 학습 리포트의 인쇄(PDF로 저장)나 기기의 화면 캡처를 이용해 주세요.', { error: true });
    } finally { btn.removeAttribute('aria-busy'); }
  });
}

/* ═══════════ 학습 리포트 · 빈 학습지 (인쇄) ═══════════ */

function openReport() {

    <fieldset class="opts"><legend>학습 리포트에 넣을 내용</legend>
