      <label class="check"><input type="checkbox" id="opAns" checked ${hasAns ? '' : 'disabled'}> 탐구 질문 답안${hasAns ? '' : ' (아직 쓴 답안이 없어요)'}</label>
      <label class="check"><input type="checkbox" id="opModel"> 모범 답안 함께 인쇄</label></fieldset>
    <div class="dialog-actions"><button class="btn primary" id="rpPrint">${icon('report')}<span>학습 리포트 인쇄(PDF로 저장)</span></button></div>
    <fieldset class="opts"><legend>빈 학습지 — 수업 전에 나눠 줄 때</legend><label class="check"><input type="checkbox" id="opTeacher"> 교사용(정답지 포함)</label></fieldset>
    <div class="dialog-actions"><button class="btn" id="wsPrint">${icon('clip')}<span>빈 학습지 인쇄</span></button></div>`, {
    onOpen: () => {
      const ch = $('#rpChange'); if (ch) ch.onclick = () => { student.asked = false; closeModal(); askStudent('report', openReport); };
      $('#rpPrint').onclick = () => {
        const o = { rec: !!($('#opRec') && $('#opRec').checked), ans: $('#opAns').checked && !$('#opAns').disabled, model: $('#opModel').checked };
        closeModal(); askStudent('report', () => printDoc(() => reportHtml(o), `${LAB_FILE}_${student.sid}_${student.name}_${todayStr()}`));
      };
      $('#wsPrint').onclick = () => { const t = $('#opTeacher').checked; closeModal(); printDoc(() => worksheetHtml(t), `${LAB_FILE}_학습지${t ? '_교사용' : ''}`); };
    },
  });
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function pvFoot() { return `<footer class="pv-foot">🧪 송쌤과학 (Song Ssaem Science) · ⓒ 2026 송세호 | 아주중학교 · 📺 YouTube @songsamscience · 📷 Instagram @songsamscience · ⚠ 무단 복제·상업적 이용 금지<br>유튜브에서 더 보기: ${CHANNELS.yt}</footer>`; }
function recSections() {
  const r = records; let h = '', n = 0;
  const sec = (t, body) => { n++; h += `<section class="pv-sec"><h2>${n}. ${t}</h2>${body}</section>`; };
  sec('전기 그네 — 움직이는 방향 (가 = 자석 안쪽, 나 = 자석 바깥쪽)', `<table class="pv-t"><thead><tr><th>과정</th><th>조건</th><th>움직이는 방향</th><th>기운 각도</th></tr></thead><tbody>${SW_ROWS.map(([k, st, c]) => { const d = r.swing[k]; return `<tr><td>${st}</td><td>${c}</td><td>${d ? d.dir : '-'}</td><td class="num">${d ? d.deg.toFixed(1) + '°' : '-'}</td></tr>`; }).join('')}</tbody></table>`);
  if (r.swingI.length) sec('전기 그네 — 전류 세기와 기운 각도', `<table class="pv-t"><thead><tr><th>전류</th><th>자석</th><th>기운 각도</th></tr></thead><tbody>${r.swingI.slice().sort((a, b) => a.strong - b.strong || a.I - b.I).map(x => `<tr><td class="num">${x.I.toFixed(2)} A</td><td>${x.strong ? '강한' : '보통'}</td><td class="num">${x.deg.toFixed(1)}°</td></tr>`).join('')}</tbody></table>`);
  if (Object.keys(r.foil).length) sec('알루미늄 포일 — 휘는 방향', `<table class="pv-t"><tbody>${FO_ROWS.map(([k, st, c]) => { const d = r.foil[k]; return `<tr><td>${st}</td><td>${c}</td><td>${d ? d.dir : '-'}</td><td class="num">${d ? d.mm.toFixed(1) + ' mm' : '-'}</td></tr>`; }).join('')}</tbody></table>`);
  sec('코일과 막대자석', `<table class="pv-t"><thead><tr><th>경우</th><th>마주 보는 두 극</th><th>코일</th></tr></thead><tbody>${CM_ROWS.map(([k, st, c]) => { const d = r.coil[k], [i, f] = k.split('|').map(Number); return `<tr><td>${st} (${c})</td><td>코일 ${i > 0 ? 'S극' : 'N극'} ↔ 자석 ${f ? 'N극' : 'S극'}</td><td>${d ? (d.kind === 'pull' ? '끌려감' : '밀려남') : '-'}</td></tr>`; }).join('')}</tbody></table>`);
  if (r.motor.length) sec('전동기 회전 기록 (앞에서 볼 때)', `<table class="pv-t"><thead><tr><th>#</th><th>조건</th><th>도는 방향</th><th>1초에 바퀴</th></tr></thead><tbody>${r.motor.map(x => `<tr><td>${x.n}</td><td>${x.V.toFixed(1)} V · ${x.strong ? '강한' : '보통'} 자석 · 코일 ${x.N}회 · 전류 ${x.key[0] === '-' ? '반대' : '처음'} · N극 ${x.key.endsWith('1') ? '오른쪽' : '왼쪽'}</td><td>${x.dir}</td><td class="num">${x.rps.toFixed(2)}</td></tr>`).join('')}</tbody></table>`);
  if (r.rule.tries.length) { const t = r.rule.tries; sec(`힘의 방향 맞히기 — ${t.filter(x => x.ok).length} / ${t.length} 맞힘`, `<table class="pv-t"><thead><tr><th>자기장</th><th>전류</th><th>내 답</th><th>정답</th></tr></thead><tbody>${t.slice(-12).map(x => `<tr><td>${DIR_BY[x.B].long}</td><td>${DIR_BY[x.I].long}</td><td>${DIR_BY[x.ans].long}</td><td>${DIR_BY[x.F].long}${x.ok ? ' ✓' : ''}</td></tr>`).join('')}</tbody></table>`); }
  return { h, n };
}
function reportHtml(o) {
  let h = `<div class="pv"><header class="pv-head"><p class="pv-kick">송쌤과학 가상실험실 · 학습 리포트</p><h1>${LAB_TITLE}</h1>
    <div class="pv-id"><span>학번 <b>${esc(student.sid)}</b></span><span>이름 <b>${esc(student.name)}</b></span><span>날짜 <b>${todayStr()}</b></span></div>
    <p class="pv-policy">모범 답안을 열면 처음 답안 잠금 · 아래에 다시 쓰기</p></header>`;
  if (o.rec) h += recSections().h;
  if (o.ans) {
    h += `<section class="pv-sec"><h2>탐구 질문</h2>`;
    QUESTIONS.forEach((q, i) => {
      const a = (answers[q.id] || '').trim(), r = (revisions[q.id] || '').trim();
      const tags = [locks[q.id] ? '모범 답안 열람함' : '열람 전 스스로 작성', hints[q.id] ? '힌트 봄' : '', r ? '모범 답안 보고 다시 씀' : ''].filter(Boolean).join(' · ');
      h += `<article class="pv-q"><h3>${i + 1}. ${q.title}</h3><p class="pv-qq">${q.q}</p><div class="pv-fig">${miniPrintSvg(q)}</div><p class="pv-tags">${tags}</p>
        <div class="pv-ans ${r || o.model ? 'cols' : ''}"><div><h4>${r ? '처음 쓴 답안' : '내가 쓴 답안'}</h4><p>${a ? esc(a).replace(/\n/g, '<br>') : '<span class="pv-empty">쓰지 않음</span>'}</p></div>
        ${o.model ? `<div><h4>모범 답안</h4><p>${q.model}</p></div>` : ''}${r ? `<div><h4>모범 답안을 보고 다시 쓴 답안</h4><p>${esc(r).replace(/\n/g, '<br>')}</p></div>` : ''}</div></article>`;
    });
    h += `</section>`;
  }
  return h + pvFoot() + '</div>';
}
function worksheetHtml(teacher) {
  let h = `<div class="pv"><header class="pv-head"><p class="pv-kick">송쌤과학 가상실험실 · 학습지</p><h1>${LAB_TITLE}</h1><div class="pv-id blank"><span>학번 <i></i></span><span>이름 <i></i></span><span>날짜 <i></i></span></div></header>`;
  h += `<section class="pv-sec"><h2>1. 전기 그네가 움직이는 방향 (가 / 나)</h2><table class="pv-t ws"><thead><tr><th>과정</th><th>조건</th><th>움직이는 방향</th></tr></thead><tbody>${SW_ROWS.map(([, st, c]) => `<tr><td>${st}</td><td>${c}</td><td></td></tr>`).join('')}</tbody></table></section>`;
  h += `<section class="pv-sec"><h2>2. 코일과 막대자석</h2><table class="pv-t ws"><thead><tr><th>경우</th><th>마주 보는 두 극</th><th>코일이 움직이는 방향</th></tr></thead><tbody>${CM_ROWS.map(([, st, c]) => `<tr><td>${st} (${c})</td><td></td><td></td></tr>`).join('')}</tbody></table></section>`;
  h += `<section class="pv-sec"><h2>3. 탐구 질문</h2>`;
  QUESTIONS.forEach((q, i) => { h += `<article class="pv-q"><h3>${i + 1}. ${q.title}</h3><p class="pv-qq">${q.q}</p><div class="pv-fig">${miniPrintSvg(q)}</div><div class="lines">${'<i></i>'.repeat(5)}</div><h4 class="ws-rev">모범 답안을 보고 다시 쓴 답안</h4><div class="lines">${'<i></i>'.repeat(3)}</div></article>`; });
  h += `</section>`;
  if (teacher) h += `<section class="pv-sec pv-key"><h2>정답지 (교사용)</h2><p>1. 과정 2 가(자석 안쪽) · 과정 3 나 · 과정 4 나 · 둘 다 바꿈 가 (교과서 그림처럼 N극이 위, (+)단자를 왼쪽에 연결했을 때)</p><p>2. 처음 끌려감 · 자기장만 바뀔 때 밀려남 · 전류만 바뀔 때 밀려남 · 둘 다 바뀔 때 끌려감</p>${QUESTIONS.map((q, i) => `<p><b>${i + 1}. ${q.title}</b> ${q.model}</p>`).join('')}</section>`;
  return h + pvFoot() + '</div>';
}
let printRestore = null;
function printDoc(make, title) {
  const pv = $('#printview'), oldTitle = document.title, oldTheme = document.documentElement.dataset.theme;
  document.title = title.replace(/[\\/:*?"<>|\s\u0000-\u001f\u007f-\u009f]/g, '');
  document.documentElement.dataset.theme = 'light'; TOK.clear();
  pv.innerHTML = make();
  printRestore = () => { document.title = oldTitle; document.documentElement.dataset.theme = oldTheme; TOK.clear(); pv.innerHTML = ''; printRestore = null; redrawAll(); };
  setTimeout(() => { window.print(); }, 60);
}
window.addEventListener('afterprint', () => { if (printRestore) printRestore(); });

/* ═══════════ 이벤트 ═══════════ */
function labAct(fn) { const L = cur.lab; if (!L) return; fn(L); L.draw(); syncPanel(); if (S.screen === 'swing') renderSwingTables(); if (S.screen === 'coil') renderCoilTable(); }
function bind() {
  document.addEventListener('click', e => {
    const t = e.target.closest('button, summary, a'); if (!t) return;
    const d = t.dataset;
    if(d.handModel) { openHandModel(); return; }
    if (d.go) { go(d.go); return; }
    if (t.hasAttribute('data-close')) { closeModal(); return; }
    if (d.theory) { openTheory(d.theory); return; }
    if (t.id === 'saveBtn') { capture(); return; }
    if (t.id === 'tPower') { labAct(L => L.setOn(!L.s.on)); return; }
    if (t.id === 'tRev') { labAct(L => L.reverse()); return; }
    if (t.id === 'tFlip') { labAct(L => L.flipMagnet()); return; }
    if (t.id === 'tNudge') { labAct(L => L.nudge()); return; }
    if (t.id === 'tDirection') { labAct(L => { L.setShow('direction', !L.s.show.direction); if (L.s.show.direction) L.setShow('force', true); }); return; }
    if (t.id === 'tHand') { labAct(L => { L.setShow('hand', !L.s.show.hand); if (L.hand && L.handAxes) { L.hand.set(...L.handAxes(), true); if(L.s.show.hand) L.s.show.force=true; } }); return; }
    if (t.id === 'labReset') { labAct(L => L.reset()); toast('실험대를 처음 상태로 돌렸어요. 기록표는 그대로 남아요.'); return; }
    if (d.view) { labAct(L => L.setView(d.view)); return; }
    if (d.rule) { labAct(L => { L.setRule(d.rule); }); return; }
    if (d.strong) { labAct(L => L.setStrong(d.strong === '1')); return; }
    if (d.turns) { labAct(L => L.setTurns(+d.turns)); return; }
    if (d.comm) { labAct(L => L.setComm(d.comm === '1')); return; }
    if (d.swmode) { if (S.swingMode !== d.swmode) { saveLab(); S.swingMode = d.swmode; store.set('ui', S); buildSwing(); } return; }
    if (t.id === 'clrI') { records.swingI = []; store.set('records', records); renderSwingTables(); return; }
    if (t.id === 'clrM') { records.motor = []; store.set('records', records); renderMotorTable(); return; }
    if (t.id === 'clrR') { const old = records.rule.tries; records.rule.tries = []; store.set('records', records); renderRulePanel(); toast('푼 기록을 지웠어요.', { action: '되돌리기', onAction: () => { records.rule.tries = old; store.set('records', records); renderRulePanel(); } }); return; }
    // 왼손 법칙
    if (d.rmode) { if (S.ruleMode !== d.rmode) { S.ruleMode = d.rmode; store.set('ui', S); saveLab(); buildRule(); } return; }
    if (d.kind) { cur.lab.set('kind', d.kind); renderRulePanel(); return; }
    if (d.dir) { const L = cur.lab; if (L.s.shown && (d.dir === 'e1' || d.dir === 'e2' || d.dir === 'ans')) { if (S.ruleMode === 'quiz') return; L.s.shown = false; L.s.ans = null; L.disp = 0; } L.set(d.dir, d.v); renderRulePanel(); const b = $(`.dirbtn[data-dir="${d.dir}"][data-v="${d.v}"]`); if (b) b.focus({ preventScroll: true }); return; }
    if (t.id === 'ruleCheck') { ruleCheck(); return; }
    if (t.id === 'ruleNext') { ruleNext(); return; }
    // 탐구 질문
    if (d.hint) { const p = $('#hint-' + d.hint); p.hidden = !p.hidden; t.setAttribute('aria-expanded', !p.hidden); if (!p.hidden && !hints[d.hint]) { hints[d.hint] = true; store.set('hints', hints); syncCard(d.hint); } return; }
    if (d.model) { askModel(d.model); return; }
    if (d.mini) { const fig = t.closest('figure.mini'); miniAct(fig.dataset.q, d.mini, null, t); return; }
    if (t.id === 'toReport') { openReport(); return; }
    // 크롬
    if (t.id === 'themeBtn') { toggleTheme(); return; }
    if (t.id === 'fullBtn') { toggleFull(); return; }
    if (t.id === 'bookBtn') { openTheory(); return; }
    if (t.id === 'helpBtn') { openHelp(); return; }
    if (t.id === 'reportBtn') { openReport(); return; }
    if (t.id === 'dHelp') { $('#drawer').close(); openHelp(); return; }
    if (t.id === 'dReport') { $('#drawer').close(); openReport(); return; }
    if (t.id === 'closeModal') { closeModal(); return; }
    if (t.id === 'closeDrawer') { $('#drawer').close(); return; }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'vIn') { cur.lab.setV(+t.value); cur.lab.draw(); syncPanel(); return; }
    if (t.id === 'gIn') { cur.lab.setGap(+t.value); cur.lab.draw(); syncPanel(); return; }
    if (t.dataset.show) { labAct(L => L.setShow(t.dataset.show, t.checked)); return; }
    if (t.dataset.mini && t.type === 'range') { miniAct(t.closest('figure.mini').dataset.q, t.dataset.mini, t.value, t); return; }
    const m = t.id.match(/^(ans|rv)-(q\d)$/);
    if (m) {
      const [, kind, q] = m;
      if (kind === 'ans') { if (locks[q]) return; answers[q] = t.value; store.set('answers', answers); syncProgress(); }
      else { revisions[q] = t.value; store.set('revisions', revisions); }
      syncCard(q);
    }
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (t.matches && t.matches('input:not([type=checkbox]):not([type=range]), textarea, select, [contenteditable]')) return;
    if ($('#modal').open || $('#drawer').open) return;
    const k = e.key.toLowerCase(), L = cur.lab, sup = L && S.screen !== 'rule' && S.screen !== 'quiz';
    if (k === 'f') { e.preventDefault(); toggleFull(); }
    else if (k === 'd') toggleTheme();
    else if (k === 'h') openHelp();
    else if (k === 'r') openReport();
    else if (k === 'c' && isBench()) capture();
    else if (k === 'i' && sup) labAct(L2 => L2.reverse());
    else if (k === 'm' && sup) labAct(L2 => L2.flipMagnet());
    else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && sup && !(t.matches && t.matches('input[type=range]'))) { e.preventDefault(); labAct(L2 => L2.setV(L2.s.V + (e.key === 'ArrowRight' ? .5 : -.5))); }
    else if (e.key === ' ' && sup && (t === document.body || t.id === 'main' || (t.closest && t.closest('.stage')))) { e.preventDefault(); labAct(L2 => L2.setOn(!L2.s.on)); }
  });
  $$('dialog').forEach(d => {
    d.addEventListener('close', () => { const r = d.id === 'drawer' ? drawerReturn : modalReturn; if (r && r.isConnected) r.focus({ preventScroll: true }); });
    d.addEventListener('click', e => { if (e.target === d) d.close(); });
  });
  document.addEventListener('toggle', e => { const c = e.target; if (c.classList && c.classList.contains('qcard') && c.open) openMini(c.dataset.q); }, true);
  document.addEventListener('fullscreenchange', syncFull);
  addEventListener('resize', () => { narrow = innerWidth <= 600; });
}

/* ═══════════ 시작 ═══════════ */
let lastTs = 0, panelT = 0;
function loop(ts) {
  const dt = lastTs ? Math.min(.05, Math.max(0, (ts - lastTs) / 1000)) : 0; lastTs = ts;
  try {
    const L = cur.lab;
    if (L) {
      if (L.step(dt) || L.drag) L.draw();
      panelT += dt; if (panelDirty || panelT > .12) { panelT = 0; panelDirty = false; syncPanel(); }
    } else if (S.screen === 'quiz') {
      for (const [qid, m] of Object.entries(minis)) {
        const card = $('#card-' + qid); if (!card || !card.open) continue;
        m.tick(dt);
        if (m.changed || (m.rt = (m.rt || 0) + dt) > .25) { m.rt = 0; if (m.changed) { m.changed = false; card.querySelector('.mini-ctl').innerHTML = m.controls(); } setT(card.querySelector('.mini-result'), m.result()); }
      }
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
function init() {
  document.addEventListener('change', e => { if (e.target.id === 'startAssist') labAct(L => { L.s.assist = e.target.checked; L.stallTime = 0; }); });
  $('#spriteDefs').innerHTML = `<linearGradient id="ig-grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--ig-1)"/><stop offset=".35" stop-color="var(--ig-2)"/><stop offset=".65" stop-color="var(--ig-3)"/><stop offset="1" stop-color="var(--ig-4)"/></linearGradient>`;
  $('#yt').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.yt}</svg>`;
  $('#ig').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.ig}</svg>`;
  $('#brandIc').innerHTML = icon('flask');
  $('#bookBtn').innerHTML = icon('book'); $('#helpBtn').innerHTML = icon('help'); $('#reportBtn').innerHTML = icon('report');
  $('#dHelp').insertAdjacentHTML('afterbegin', icon('help')); $('#dReport').insertAdjacentHTML('afterbegin', icon('report'));
  $('#closeModal').innerHTML = icon('x'); $('#closeDrawer').innerHTML = icon('x');
  $('#ver').textContent = `v${APP_VERSION}`;
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
  syncFull(); bind(); go(S.screen);
  requestAnimationFrame(loop);
}
init();
